name: garagi
description: "Garagi — Car maintenance tracker & reminder for the Lebanese market."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # i18n / formatting
  intl: ^0.20.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Local persistence (offline-first catalog + cache)
  shared_preferences: ^2.3.2

  # Iterable helpers (firstOrNull, etc.)
  collection: ^1.18.0

  # --- Firebase (wired but opt-in; see lib/core/firebase/firebase_options.dart) ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3

  # Local notifications (offline reminders)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # OAuth sign-in (Firebase auth providers)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # PDF export of service history
  pdf: ^3.11.1
  printing: ^5.13.3

  # Invoice / vehicle photo capture
  image_picker: ^1.1.2

  # HTTP (VIN decode via NHTSA vPIC)
  http: ^1.2.2

  # Monetization (mobile-only; loaded via conditional imports)
  purchases_flutter: ^8.2.1
  google_mobile_ads: ^5.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon_1024.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#011E4B"
  adaptive_icon_foreground: "assets/brand/icon_foreground_1024.png"

# Splash screen (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#011E4B"
  image: "assets/brand/icon_foreground_1024.png"
  android_12:
    color: "#011E4B"
    image: "assets/brand/icon_foreground_1024.png"

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from lib/l10n/*.arb
  assets:
    - assets/brand/
