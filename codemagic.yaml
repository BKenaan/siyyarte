# Codemagic cloud build for Siyyarte — lets us build & ship iOS WITHOUT a Mac.
#
# ONE-TIME SETUP in the Codemagic web UI (no Mac needed):
#   1. Sign up at codemagic.io, add this Git repo.
#   2. Apple: create an App Store Connect API key (App Store Connect → Users and
#      Access → Integrations → App Store Connect API). In Codemagic →
#      Teams/Integrations → Apple → add it. Note the integration name and put it
#      under integrations.app_store_connect below.
#   3. Create the app in App Store Connect (bundle id com.garagi.garagi).
#   4. Codemagic → code signing (iOS) → "Automatic" using that API key.
#   5. Upload GoogleService-Info.plist + (later) the APNs key in the Firebase
#      console; add GoogleService-Info.plist to the repo or as an env file.
#
# Then push to the repo / press Build — Codemagic compiles on macOS, signs, and
# uploads to TestFlight.

workflows:
  ios-testflight:
    name: Siyyarte iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: CODEMAGIC_ASC_KEY   # <-- name of your ASC API key integration
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.garagi.garagi
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add internal/beta tester groups here once created in App Store Connect.

  # Optional: Android release via the same CI (parity with the local builds).
  android-release:
    name: Siyyarte Android — AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Flutter packages
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
